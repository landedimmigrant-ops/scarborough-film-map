<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Scarborough Film Map</title>
  <meta name="theme-color" content="#0f1419" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Film Map" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="side-head">
        <h1>Scarborough <span>Film Map</span></h1>
        <div class="project-bar">
          <select id="project-select" title="Active project"></select>
          <button id="rename-project" class="icon-btn" title="Rename this project" aria-label="Rename this project">✎</button>
          <button id="new-project" class="icon-btn" title="New project" aria-label="New project">＋</button>
        </div>
        <p class="tagline">Click the map to add a location.</p>
      </header>

      <div class="controls">
        <label class="search-label" for="search">🔍 Filter saved locations</label>
        <input id="search" type="search" placeholder="Search locations, people, notes…" autocomplete="off" aria-label="Filter saved locations" />
        <div class="row">
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="idea">Idea</option>
            <option value="scouting">Scouting</option>
            <option value="confirmed">Confirmed</option>
            <option value="shot">Shot</option>
          </select>
          <select id="filter-hood"><option value="">All neighbourhoods</option></select>
        </div>
        <div class="row">
          <button id="use-location" class="btn ghost" title="Drop a pin at your current GPS location">📍 My location</button>
          <button id="plan-day" class="btn ghost" title="Build a shoot list from nearby locations">🗓 Plan a day</button>
        </div>
        <div class="row">
          <button id="review-suggestions" class="btn ghost" title="Review locations people have suggested">💡 Suggestions<span id="sugg-badge" class="badge" hidden>0</span></button>
        </div>
      </div>

      <div class="stats" id="stats"></div>
      <div id="list" class="list"><div class="empty">Loading your locations…</div></div>

      <footer class="side-foot">
        <div class="foot-actions">
          <button id="export" class="btn ghost" title="Download this project as JSON">⭳ JSON</button>
          <button id="export-scenes" class="btn ghost" title="Markdown scene list for script-writing">📝 Scenes</button>
          <button id="export-credits" class="btn ghost" title="Contributor credits list (only those who consented)">🎬 Credits</button>
        </div>
        <span class="count" id="count">0 locations</span>
      </footer>
    </aside>

    <main id="map"></main>

    <!-- Location detail / editor -->
    <section id="detail" class="panel" role="dialog" aria-modal="true" aria-labelledby="detail-h" tabindex="-1" hidden>
      <header class="panel-head">
        <strong id="detail-h">Location</strong>
        <button class="icon-btn" id="detail-close" title="Close" aria-label="Close">✕</button>
      </header>
      <div class="panel-body" id="detail-body"></div>
    </section>

    <!-- Suggestion review queue -->
    <section id="suggestions" class="panel" role="dialog" aria-modal="true" aria-label="Review suggested locations" tabindex="-1" hidden>
      <header class="panel-head">
        <strong>💡 Suggested locations</strong>
        <button class="icon-btn" id="suggestions-close" title="Close" aria-label="Close">✕</button>
      </header>
      <div class="panel-body" id="suggestions-body"></div>
    </section>

    <!-- Shoot-day planner -->
    <section id="planner" class="panel" role="dialog" aria-modal="true" aria-label="Plan a shoot day" tabindex="-1" hidden>
      <header class="panel-head">
        <strong>🗓 Plan a shoot day</strong>
        <button class="icon-btn" id="planner-close" title="Close" aria-label="Close">✕</button>
      </header>
      <div class="panel-body" id="planner-body"></div>
    </section>

    <button id="sidebar-toggle" class="mobile-only" title="Toggle list">☰ Locations</button>

    <!-- Map overlay controls -->
    <div id="place-search">
      <label class="search-label" for="place-q">📍 Find a place on the map</label>
      <input id="place-q" type="search" placeholder="Search any address or place…" autocomplete="off" aria-label="Find a place on the map to add" />
      <ul id="place-results" hidden></ul>
    </div>
    <button id="sat-toggle" title="Switch between street map and satellite imagery">🛰 Satellite</button>
    <button id="explore-toggle" title="Click anywhere on the map to learn about the neighbourhood and nearby landmarks">🔍 What's here?</button>
    <div id="mode-pill" hidden>🔍 Explore mode — click the map for info</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
